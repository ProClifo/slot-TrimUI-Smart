[package]
name = "slot-gfx"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["host"]
host = ["dep:glutin", "dep:glutin-winit", "dep:winit", "dep:raw-window-handle"]
device = []
# Draw on the CPU into /dev/fb0, for panels with no GPU. A device build feature: the host
# window still needs the GL compositor.
soft = ["device"]
test-support = []

[dependencies]
gl = { workspace = true }
libloading = { workspace = true }
libc = { workspace = true }
glutin = { workspace = true, optional = true }
glutin-winit = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
